name: CI

# Proteção de branch é recurso pago no GitHub, então o gate mora aqui e no script
# de build: lint com erro reprova o job, e reprova o deploy na Vercel junto.
on:
  push:
  pull_request:

jobs:
  verificar:
    name: testes + lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24, igual ao desenvolvimento. O 20 não serve: o npm test passa um glob
      # para o node --test ("lib/**/*.test.ts"), e glob no --test só existe a
      # partir do Node 21 — no 20 o padrão vira caminho literal e o job reprova.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run type-check
