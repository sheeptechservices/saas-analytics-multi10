name: CI

# Proteção de branch é recurso pago no GitHub, então o gate mora aqui e no script
# de build: lint com erro reprova o job, e reprova o deploy na Vercel junto.
on:
  push:
  pull_request:

jobs:
  verificar:
    name: lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run type-check
